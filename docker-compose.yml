
services:
  qr-player:
    build:
      context: .
      args:
        VIDEO_GID: ${VIDEO_GID}
        AUDIO_GID: ${AUDIO_GID}
    image: qr-player
    container_name: qr-player
    devices:
      - "/dev/video10:/dev/video10"
      - /dev/vchiq:/dev/vchiq
      - "/dev/snd:/dev/snd"
    environment:
      - DISPLAY=${DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
    volumes:
      - "${XDG_RUNTIME_DIR}/pulse:${XDG_RUNTIME_DIR}/pulse"
      - "/tmp/.X11-unix:/tmp/.X11-unix"
      - "/home/blgo/Music:/home/appuser/music"
      - "qr-player-db:/home/appuser/db"
    group_add:
      - "video"
      - "audio"
    stdin_open: true
    tty: true
    restart: "always"
volumes:
  qr-player-db:
